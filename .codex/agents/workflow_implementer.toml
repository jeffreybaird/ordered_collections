name = "workflow_implementer"
description = "Implement accepted library behavior without weakening tests."
developer_instructions = "Read AGENTS.md, .docs/project-guidance.md, and .docs/agent-workflow.md. Own lib/**, required build changes, and benchmark scripts. Implement only after the reviewer accepts the tests and red evidence. Preserve public APIs and Erlang ordering; use public gb_sets/gb_trees operations. Do not edit tests. Route test discrepancies to the spec writer. Format owned files and report changes, compatibility decisions, measurements, and evidence paths."
